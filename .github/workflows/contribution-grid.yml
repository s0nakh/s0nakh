name: contribution-grid

on:
  schedule:
    - cron: "0 0 * * *"   # раз в сутки
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution grid (sand palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#C8B48A&color_dots=#161b22,#3b3424,#615439,#94805a,#c8b48a
            dist/snake-light.svg?color_snake=#8a7448&color_dots=#ebedf0,#efe5cf,#dcc89c,#b89d68,#8a7448

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
